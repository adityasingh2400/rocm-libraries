#
# Decoupled-PGR hero case probe: F8F4 TN MT64x512x512 on gfx1250, TDM path.
#
# Same as hero_f8f4_gfx1250.yaml but with TDMInst=3, which is the real gfx1250
# tensor-data-mover path. Auto LdsBlockSizePerPadB differs (1024 vs 4096), so B
# is slightly larger:
#   1LDSBuffer=1  -> 166400 B (162.50 KiB), A=33280, B=133120
#   coupled PGR=2 -> 332800 B (325.00 KiB), rejected
#   decoupled A:1/B:2 -> 299520 B (292.50 KiB), fits
#
# Runs against the CURRENT tree (no new parameters) and is meant for
# docs/decouple-pgr/lds_budget_probe.py, not for pytest collection:
#
#     python3 docs/decouple-pgr/lds_budget_probe.py \
#         docs/decouple-pgr/configs/hero_f8f4_gfx1250_tdm.yaml gfx1250
#
# 1LDSBuffer is forked over [0, 1] on purpose so one run shows both the rejected
# coupled variant and the per-tensor footprints of the variant that fits.
#
# MatrixInstruction [16,16,128,1, 1, 2,16, 2,2] gives MacroTile0=64,
# MacroTile1=512, NumWaves=4.
GlobalParameters:
  SyncsPerBenchmark: 0
  NumElementsToValidate: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  PrintSolutionRejectionReason: True
  Device: 0

BenchmarkProblems:
  -
    - # ProblemType, TN
      OperationType: GEMM
      MacDataTypeA: F8
      MacDataTypeB: F4
      DataType: F8
      DestDataType: s
      ComputeDataType: s
      HighPrecisionAccumulate: True
      TransposeA: True
      TransposeB: False
      UseBeta: True
      Batched: True
      Activation: False
      SupportUserArgs: True
      UseBias: 0

    - # BenchmarkProblemSizeGroup
      InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1, 1, 2, 16, 2, 2]
        - DepthU: [512]
        - TransposeLDS: [-1]
        - LdsPadA: [-1]
        - LdsPadB: [-1]
        - LdsBlockSizePerPadA: [-1]
        - LdsBlockSizePerPadB: [-1]
        - LdsPadMetadata: [0]
        - LDSTrInst: [True]
        - StaggerU: [0]
        - ScheduleIterAlg: [3]
        - PrefetchLocalRead: [1]
        - PrefetchGlobalRead: [2]
        - StoreRemapVectorWidth: [0]
        - GlobalSplitU: [1]
        - GlobalSplitUAlgorithm: [MultipleBuffer]
        - GlobalReadVectorWidthA: [-1]
        - GlobalReadVectorWidthB: [-1]
        - VectorWidthA: [-1]
        - VectorWidthB: [-1]
        - LocalReadVectorWidth: [-1]
        - 1LDSBuffer: [0, 1]
        - TDMInst: [3]
        - SourceSwap: [True]
        - DirectToVgprSparseMetadata: [False]
        - WorkGroupMapping: [1]
        - StoreVectorWidth: [-1]
        - DirectToVgprA: [False]
        - DirectToVgprB: [False]
        - WavefrontSize: [32]
        - ExpandPointerSwap: [False]
      BenchmarkForkParameters:
      JoinParameters:
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [512, 512, 1, 512]
